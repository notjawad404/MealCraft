<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23B4411F'/><path d='M16 6a5.5 5.5 0 0 1 5.05 3.34A5.5 5.5 0 0 1 23.5 19.6v1.65h-15V19.6A5.5 5.5 0 0 1 10.95 9.34 5.5 5.5 0 0 1 16 6Z' fill='%23FCF9F4'/><rect x='8.5' y='23.25' width='15' height='3.25' rx='1.6' fill='%23FCF9F4'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MealCraft — keep the recipes worth cooking twice. A calm, uncluttered cookbook for home cooks." />
    <meta name="theme-color" content="#FCF9F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12100D" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>MealCraft — Keep the recipes worth cooking twice</title>

    <script>
      // Apply the saved theme before first paint so dark mode never flashes white.
      (function () {
        try {
          var saved = localStorage.getItem('mealcraft-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* storage unavailable — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
